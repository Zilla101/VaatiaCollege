<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Login - Vaatia College</title>
    <link rel="stylesheet" href="styles/admin.css">
    <style>
        body{display:flex;align-items:center;justify-content:center;height:100vh;background:#f5f7fb;font-family:system-ui,Segoe UI,Roboto,Arial}
        .card{background:#fff;padding:2rem;border-radius:12px;box-shadow:0 8px 30px rgba(20,20,40,0.06);max-width:420px;width:100%}
        input{width:100%;padding:0.7rem;margin-top:0.6rem;border:1px solid #ddd;border-radius:8px}
        button{margin-top:1rem;padding:0.7rem 1rem;border:0;border-radius:8px;background:#2b6cb0;color:#fff}
        .muted{color:#666;font-size:0.9rem;margin-top:0.6rem}
    </style>
</head>
<body>
    <div class="card" role="main">
        <h2>Admin Panel Access</h2>
        <p class="muted">This page notifies site owners when the admin panel is accessed.</p>
        <label for="user">Your name or email</label>
        <input id="user" placeholder="admin@company.com" autocomplete="username">
        <div style="display:flex;gap:0.5rem;align-items:center">
            <button id="notify">Notify & Continue</button>
            <a href="/" style="margin-left:auto;align-self:center;color:#2b6cb0;text-decoration:none">Return</a>
        </div>
        <p id="status" class="muted"></p>
    </div>

    <script>
        async function sendAlert(user) {
            const payload = {
                user: user || 'anonymous',
                device: navigator.userAgent || 'unknown',
                resolution: `${screen.width}x${screen.height}`,
                time: new Date().toISOString(),
                url: window.location.href
            };

            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(payload)
                });
                return res.ok;
            } catch (e) {
                return false;
            }
        }

        document.getElementById('notify').addEventListener('click', async function () {
            const user = document.getElementById('user').value.trim();
            document.getElementById('status').textContent = 'Sending notification...';
            const ok = await sendAlert(user);
            document.getElementById('status').textContent = ok ? 'Notification sent. Redirecting…' : 'Notification failed (offline).';
            if (ok) setTimeout(() => { window.location.href = '/admin/'; }, 900);
        });
    </script>
</body>
</html>
